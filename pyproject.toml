[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "inventory-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.119.1", "sqlalchemy==2.0.44", "uvicorn==0.38.0"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "httpx==0.28.1", "ruff==0.14.2"]
[tool.setuptools.packages.find]
include = ["inventory*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=inventory --cov-report=term-missing --cov-fail-under=75"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
